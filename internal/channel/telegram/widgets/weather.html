<html><head><!--CARD_STYLE--><style>.illustration g{display:none}.illustration.clear .sun,.illustration.partly_cloudy .sun,.illustration.partly_cloudy .cloud,.illustration.cloudy .cloud,.illustration.rain .cloud,.illustration.snow .cloud,.illustration.thunderstorm .cloud,.illustration.fog .cloud,.illustration.rain .rain,.illustration.snow .snow,.illustration.thunderstorm .storm,.illustration.fog .fog,.illustration.unknown .unknown{display:inline}.illustration.night .sun{display:none}.illustration.night:not(.unknown) .moon{display:inline}</style></head><body>
<header><div class="eyebrow" id="eyebrow"></div><h1 id="location"></h1><p class="meta" id="period"></p></header>
<section class="weather-scene" id="scene"><div class="weather-hero"><div class="stack"><p class="hero-label" id="kind"></p><p class="temperature" id="temperature"></p></div><div class="weather-art illustration unknown" id="art" aria-hidden="true"><!--WEATHER_ART--></div></div><p class="condition" id="condition"></p><p class="range-note" id="range"></p></section>
<section class="metrics" id="metrics"><div class="metric"><p class="metric-label"></p><p class="metric-value"></p></div><div class="metric"><p class="metric-label"></p><p class="metric-value"></p></div><div class="metric"><p class="metric-label"></p><p class="metric-value"></p></div></section><section class="daily" id="days"><div class="daily-row"><span class="weekday"></span><span class="daily-icon illustration unknown" aria-hidden="true"><!--WEATHER_ART--></span><span class="daily-temp"></span></div><div class="daily-row"><span class="weekday"></span><span class="daily-icon illustration unknown" aria-hidden="true"><!--WEATHER_ART--></span><span class="daily-temp"></span></div><div class="daily-row"><span class="weekday"></span><span class="daily-icon illustration unknown" aria-hidden="true"><!--WEATHER_ART--></span><span class="daily-temp"></span></div><div class="daily-row"><span class="weekday"></span><span class="daily-icon illustration unknown" aria-hidden="true"><!--WEATHER_ART--></span><span class="daily-temp"></span></div></section>
<footer class="footer weather-footer"><span id="source"></span><span id="updated"></span></footer>
<script>
const W=TelegramWidget,$=id=>document.getElementById(id),known=['clear','partly_cloudy','cloudy','rain','snow','thunderstorm','fog'];
function condition(code){return known.indexOf(code)>=0?code:'unknown';}
function draw(){let s;try{s=JSON.parse(W.chatData||'{}')}catch(e){return}const ru=s.a==='ru',has=s.t!==undefined&&s.t!==null&&String(s.t)!=='';const code=condition(s.k),night=s.n===true;$('eyebrow').textContent=ru?'Погода':'Weather';$('location').textContent=s.l||(ru?'Место не указано':'Location unavailable');$('period').textContent=s.p||'';$('scene').className='weather-scene '+code+(night?' night':'')+(s.f?' forecast':'');$('temperature').className='temperature'+(s.f?' range':'')+(has&&String(s.t).length>4?' long':'');$('temperature').textContent=has?String(s.t):'—';$('kind').textContent=!has?(ru?'Нет данных':'No data'):s.f?(ru?'Прогноз':'Forecast'):(ru?'Сейчас':'Now');$('condition').textContent=s.c||(ru?'Условия неизвестны':'Conditions unavailable');$('range').textContent=s.r||'';$('art').className='weather-art illustration '+code+(night?' night':'');const metrics=(s.m||[]).filter(m=>m.v!==undefined&&m.v!==null&&String(m.v)!=='').slice(0,3);$('metrics').style.display=metrics.length?'flex':'none';document.querySelectorAll('.metric').forEach((box,i)=>{const m=metrics[i];box.style.display=m?'block':'none';box.querySelector('.metric-label').textContent=m?m.l||'':'';box.querySelector('.metric-value').textContent=m?String(m.v):'';});const days=(s.d||[]).slice(0,4);$('days').style.display=days.length?'block':'none';document.querySelectorAll('.daily-row').forEach((row,i)=>{const d=days[i];row.style.display=d?'flex':'none';row.querySelector('.weekday').textContent=d?d.d||'':'';row.querySelector('.daily-temp').textContent=d?d.t||'':'';row.querySelector('.daily-icon').className='daily-icon illustration '+condition(d&&d.k);});$('source').textContent=s.s||'';$('updated').textContent=s.u||'';}
W.onEvent('chatDataChanged',()=>draw());draw();W.ready();
</script></body></html>
