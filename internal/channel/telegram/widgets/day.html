<html><head><!--CARD_STYLE--></head><body>
<header><div class="eyebrow" id="eyebrow"></div><h1 id="h"></h1><p class="meta" id="meta"></p></header>
<button class="section" id="section"></button>
<section id="rows"></section>
<nav class="nav" id="navigation"><button class="arrow" id="prev" aria-label="Previous">←</button><button id="refresh"></button><button class="arrow" id="next" aria-label="Next">→</button></nav>
<p class="footer" id="m"></p><p class="notice" id="notice" role="status"></p>
<script>
const W=TelegramWidget,$=id=>document.getElementById(id),L={en:['My day','Refresh','Complete','Reschedule…','Could not update. Try again later.','Remind…','Change section','Details','Result file','Publish…','Review uncertainty','Personal assistant','More','Back','Entries will appear here.','Sending…'],ru:['Мой день','Обновить','Выполнить','Перенести…','Не удалось обновить. Повторите позже.','Напомнить…','Сменить раздел','Подробнее','Файл результата','Опубликовать…','Принять неопределённость','Личный помощник','Ещё','Назад','Здесь появятся записи.','Отправляем…']};let lang=L.en,busy=false,refreshTimer=null,refreshHandle='',menu=false,menuPage=0,latest={};
function disable(){$('m').style.display=$('notice').textContent?'none':'';document.querySelectorAll('button').forEach(b=>{b.disabled=busy||b.dataset.available==='0'||W.isPreview;});}
function button(text,fn,primary){let b=document.createElement('button');b.textContent=text;b.className=primary?'primary':'secondary';b.dataset.available='1';b.onclick=fn;return b;}
function req(v,background){if(!v||busy)return;busy=true;if(!background)$('notice').textContent=lang[15];disable();W.request(v).then(a=>{busy=false;if(!background)$('notice').textContent=a&&typeof a.result==='string'?a.result:'';draw();},e=>{busy=false;if(!background)$('notice').textContent=e&&e.code==='BUSY'?'':lang[4];disable();});}
function refreshVisible(){if(W.isActive&&!W.isPreview&&!W.isForward&&W.chatType==='private')req(refreshHandle,true);}
function startRefresh(){if(!W.isActive||W.isPreview||W.isForward||W.chatType!=='private'||refreshTimer!==null)return;refreshTimer=setInterval(refreshVisible,30000);refreshVisible();}
function stopRefresh(){if(refreshTimer!==null)clearInterval(refreshTimer);refreshTimer=null;}
function draw(){let s;try{s=JSON.parse(W.chatData||'{}');}catch(e){return;}latest=s;lang=L[s.l]||L.en;refreshHandle=s.f||'';let h=String(s.h||lang[0]).split(' · ');$('h').textContent=h.shift();$('meta').textContent=h.join(' · ');$('eyebrow').textContent=lang[11];$('m').textContent=s.m||'';$('refresh').textContent=lang[1];$('prev').setAttribute('aria-label',s.l==='ru'?'Предыдущая запись':'Previous entry');$('next').setAttribute('aria-label',s.l==='ru'?'Следующая запись':'Next entry');$('section').textContent=(s.g||'')+'  →';$('section').setAttribute('aria-label',lang[6]);$('section').dataset.available=s.x?'1':'0';$('section').onclick=()=>{menu=false;req(s.x);};const root=$('rows');root.textContent='';const r=(s.r||[])[0];if(r){let panel=document.createElement('article');panel.className='surface';let source=document.createElement('p');source.className='item-source';const names={todoist:'Todoist',google_tasks:'Google Tasks',craft_tasks:'Craft',reminders:s.l==='ru'?'Напоминания':'Reminders',calendar:s.l==='ru'?'Календарь':'Calendar',jobs:s.l==='ru'?'Фоновые задания':'Background jobs',operations:s.l==='ru'?'Операции':'Operations'};source.textContent=names[r.o]||r.o||'';if(r.o)panel.appendChild(source);let title=document.createElement('h2');title.className='content';title.textContent=r.t||'';panel.appendChild(title);if(r.d){let due=document.createElement('p');due.className='item-due';due.textContent=r.d;panel.appendChild(due);}let acts=[[lang[2],r.c],[lang[10],r.k],[lang[7],r.v],[lang[3],r.s],[lang[5],r.a],[lang[8],r.z],[lang[9],r.u]].filter(a=>a[1]);let main=acts[0],others=acts.slice(1);if(menu){let area=document.createElement('div');area.className='menu';others.slice(menuPage*2,menuPage*2+2).forEach(a=>area.appendChild(button(a[0],()=>req(a[1]))));let nav=document.createElement('div');nav.className='actions';nav.appendChild(button(lang[13],()=>{menu=false;draw();}));if(others.length>(menuPage+1)*2)nav.appendChild(button(lang[12],()=>{menuPage++;draw();}));area.appendChild(nav);panel.appendChild(area);}else{if(main)panel.appendChild(button(main[0],()=>req(main[1]),true));if(others.length){let area=document.createElement('div');area.className='actions';area.appendChild(button(others[0][0],()=>req(others[0][1])));if(others.length>1)area.appendChild(button(lang[12],()=>{menu=true;menuPage=0;draw();}));panel.appendChild(area);}}root.appendChild(panel);}else{let p=document.createElement('p');p.className='surface empty';p.textContent=lang[14];root.appendChild(p);menu=false;}$('navigation').style.display=menu?'none':'flex';[['prev',s.p],['next',s.n],['refresh',s.f]].forEach(x=>{let b=$(x[0]);b.dataset.available=x[1]?'1':'0';b.onclick=()=>{menu=false;req(x[1]);};});disable();startRefresh();}
W.onEvent('chatDataChanged',()=>{$('notice').textContent='';draw();});W.onEvent('activated',startRefresh);W.onEvent('deactivated',stopRefresh);draw();W.ready();
</script></body></html>
