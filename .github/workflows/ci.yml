name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-contract:
    name: Mobile Contract Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify checked-in Go and generate Kotlin stubs
        run: make proto-mobile-check proto-mobile-jvm
      - name: Check persistent OAuth framework experiment
        run: make test-mobile-oauth
      - name: Check OAuth wire schemas
        run: |
          python3 -m pip install -r scripts/requirements-mobile-contract.txt
          python3 scripts/check_mobile_oauth.py

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create ui/dist placeholder for embed
        run: mkdir -p ui/dist && touch ui/dist/.gitkeep

      - name: Install PDF text extraction runtime
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run tests with coverage
        env:
          CGO_ENABLED: "0"
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check mobile persistence races
        run: go test -race -p 2 ./internal/mobile/...

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        run: cd ui && npm ci --no-audit --no-fund && npm run build

      - name: Build Go binary
        run: make build-go

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Create ui/dist placeholder for embed
        run: mkdir -p ui/dist && touch ui/dist/.gitkeep

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          only-new-issues: true

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci --no-audit --no-fund

      - name: Run vitest with coverage
        run: cd ui && npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./ui/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci --no-audit --no-fund

      - name: TypeScript type-check
        run: cd ui && npx vue-tsc --noEmit

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin/
          gitleaks detect --source . --verbose
