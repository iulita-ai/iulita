name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: iulita-release-publication
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  containers:
    uses: ./.github/workflows/container-images.yml
    permissions:
      contents: read

  publish:
    needs: containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: checked-*-${{ github.run_attempt }}
          path: checked-images
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the five checked archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/container_security.py publish checked-images "$RELEASE_TAG"
      - name: Retain immutable publication receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-image-digests-${{ github.run_attempt }}
          path: checked-images/published.json
          if-no-files-found: warn

  github-release:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build frontend
        run: cd ui && npm ci --no-audit --no-fund && npm run build

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          PKG=github.com/iulita-ai/iulita/internal/version
          FLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Date=${DATE}"

          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="${FLAGS}" -o iulita-linux-amd64       ./cmd/iulita/
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="${FLAGS}" -o iulita-linux-arm64       ./cmd/iulita/
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="${FLAGS}" -o iulita-darwin-arm64      ./cmd/iulita/
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="${FLAGS}" -o iulita-windows-amd64.exe ./cmd/iulita/
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="${FLAGS}" -o iulita-ssh-worker-linux-amd64 ./cmd/ssh-worker/
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="${FLAGS}" -o iulita-ssh-worker-linux-arm64 ./cmd/ssh-worker/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            iulita-linux-amd64
            iulita-linux-arm64
            iulita-darwin-arm64
            iulita-windows-amd64.exe
            iulita-ssh-worker-linux-amd64
            iulita-ssh-worker-linux-arm64
