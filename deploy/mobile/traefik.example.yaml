# Review-only template for Traefik >=3.6 with matching CRDs. No Deployment,
# credentials, domain registration, PVC or feature enablement is provided here.
apiVersion: v1
kind: Service
metadata:
  name: iulita-mobile
  namespace: iulita-mobile-example
spec:
  selector:
    app: iulita
  ports:
    - name: grpc-tls
      port: 8443
      targetPort: 8443
    - name: oauth-tls
      port: 8444
      targetPort: 8444
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: mobile-tls
  namespace: iulita-mobile-example
spec:
  serverName: mobile.example.invalid
  insecureSkipVerify: false
  rootCAs:
    - secret: mobile-backend-ca
  disableHTTP2: false
  forwardingTimeouts:
    dialTimeout: 5s
    responseHeaderTimeout: 10s
    idleConnTimeout: 90s
    readIdleTimeout: 30s
    pingTimeout: 10s
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: mobile-tls13
  namespace: iulita-mobile-example
spec:
  minVersion: VersionTLS13
  alpnProtocols: [h2, http/1.1]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mobile-grpc
  namespace: iulita-mobile-example
spec:
  entryPoints: [mobile-secure]
  routes:
    - kind: Rule
      match: Host(`mobile.example.invalid`) && PathPrefix(`/iulita.mobile.v1.`)
      observability:
        accessLogs: false
        tracing: false
        metrics: false
      services:
        - name: iulita-mobile
          port: grpc-tls
          scheme: https
          passHostHeader: true
          serversTransport: mobile-tls
          responseForwarding:
            flushInterval: 1ms
  tls:
    secretName: mobile-public-tls
    options:
      name: mobile-tls13
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mobile-oauth
  namespace: iulita-mobile-example
spec:
  entryPoints: [mobile-secure]
  routes:
    - kind: Rule
      match: Host(`mobile.example.invalid`) && (PathPrefix(`/oauth2/`) || Path(`/.well-known/oauth-authorization-server`) || Path(`/.well-known/assetlinks.json`) || Path(`/mobile/oauth/callback`))
      observability:
        accessLogs: false
        tracing: false
        metrics: false
      services:
        - name: iulita-mobile
          port: oauth-tls
          scheme: https
          passHostHeader: true
          serversTransport: mobile-tls
  tls:
    secretName: mobile-public-tls
    options:
      name: mobile-tls13
